name: Simulation Scene Tests (a5sim)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
      runs_on:
        required: true
        type: string
      setup_variant:
        description: github or self-cpu.
        required: true
        type: string
      include_dfx_smokes:
        required: false
        default: false
        type: boolean
      issue_2181_repro:
        required: false
        default: false
        type: boolean
      manual_mode:
        description: exclude for Per-PR, include for the Daily full sweep.
        required: false
        default: exclude
        type: string
      python_version:
        required: false
        default: "3.10"
        type: string
      scheduler_timeout_ms:
        description: Scheduler timeout budget in milliseconds.
        required: false
        default: "10000"
        type: string

jobs:
  run:
    name: st-sim-a5sim
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: ${{ inputs.issue_2181_repro && 180 || 30 }}
    env:
      MANUAL_MODE: ${{ inputs.manual_mode }}
      SIMPLER_SCHEDULER_TIMEOUT_MS: ${{ inputs.scheduler_timeout_ms }}
    steps:
      - name: Checkout target
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Validate manual mode
        run: |
          case "$MANUAL_MODE" in
            exclude|include|only) ;;
            *)
              echo "::error::manual_mode must be exclude, include, or only"
              exit 2
              ;;
          esac

      - name: Set up C++ compiler
        if: inputs.setup_variant == 'github'
        uses: ./.github/actions/setup-gcc-15
        with:
          install-graphviz: "true"

      - name: Verify provisioned toolchain
        if: inputs.setup_variant == 'self-cpu'
        run: |
          command -v ninja
          command -v g++
          command -v dot
          if ! command -v g++-15 >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/bin"
            ln -sf "$(command -v g++)" "$RUNNER_TEMP/bin/g++-15"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi

      - name: Set up Python ${{ inputs.python_version }}
        if: inputs.setup_variant == 'github'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Cache pip packages
        uses: ./.github/actions/cache-pip

      - name: Set up environment
        uses: ./.github/actions/setup-venv
        with:
          build-packages: "scikit-build-core nanobind<3 cmake>=3.20"
          packages: "--no-build-isolation --config-settings=build.targets=build_package_a5sim .[test]"

      - name: Run pytest scene tests
        if: ${{ !inputs.issue_2181_repro }}
        run: |
          .venv/bin/python -m pytest examples tests/st --platform a5sim --device 0-15 -v \
            --pto-session-timeout 600 --require-pto-isa \
            --manual "$MANUAL_MODE"

      - name: dep_gen smoke (a5)
        if: inputs.include_dfx_smokes && !inputs.issue_2181_repro
        run: |
          .venv/bin/python -m pytest tests/st/a5/tensormap_and_ringbuffer/dfx/dep_gen/ \
            --platform a5sim --device 0-15 -p no:xdist --pto-session-timeout 600 \
            --require-pto-isa --manual "${{ inputs.manual_mode == 'only' && 'only' || 'include' }}" --enable-dep-gen

      - name: dep_gen smoke (a5 host_build_graph)
        if: inputs.include_dfx_smokes && !inputs.issue_2181_repro
        run: |
          .venv/bin/python -m pytest tests/st/a5/host_build_graph/dfx/dep_gen/ \
            --platform a5sim --device 0-15 -p no:xdist --pto-session-timeout 600 \
            --require-pto-isa --manual "${{ inputs.manual_mode == 'only' && 'only' || 'include' }}" --enable-dep-gen

      - name: chip_swimlane smoke (a5)
        if: inputs.include_dfx_smokes && !inputs.issue_2181_repro
        run: |
          .venv/bin/python -m pytest tests/st/a5/tensormap_and_ringbuffer/dfx/chip_swimlane/ \
            --platform a5sim --device 0-15 -p no:xdist --pto-session-timeout 600 \
            --require-pto-isa --manual "${{ inputs.manual_mode == 'only' && 'only' || 'include' }}" \
            --enable-chip-swimlane --enable-dep-gen

      - name: chip_swimlane smoke (a5 host_build_graph)
        if: inputs.include_dfx_smokes && !inputs.issue_2181_repro
        run: |
          for level in 1 2; do
            .venv/bin/python -m pytest \
              tests/st/a5/host_build_graph/dfx/chip_swimlane/test_scheduler_phases.py \
              --case TestSchedulerPhases::resolve_dummy \
              --platform a5sim --device 0-15 -p no:xdist --pto-session-timeout 600 \
              --require-pto-isa --manual "${{ inputs.manual_mode == 'only' && 'only' || 'include' }}" \
              --enable-chip-swimlane "$level"
          done
          .venv/bin/python -m pytest \
            tests/st/a5/host_build_graph/dfx/chip_swimlane/test_scheduler_phases.py \
            tests/st/a5/host_build_graph/single_core_dag/test_single_core_dag.py \
            --case TestSchedulerPhases::resolve_dummy \
            --case TestHbgSingleCoreDag::mixed_multi_root_64 \
            --platform a5sim --device 0-15 -p no:xdist --pto-session-timeout 600 \
            --require-pto-isa --manual "${{ inputs.manual_mode == 'only' && 'only' || 'include' }}" \
            --enable-chip-swimlane 3

      - name: Reproduce issue 2181 on macOS a5sim
        if: inputs.issue_2181_repro
        run: |
          mkdir -p issue-2181-artifacts
          for attempt in $(seq 1 200); do
            rm -rf outputs
            echo "$attempt" > issue-2181-artifacts/attempt.txt
            echo "::notice::issue 2181 reproduction attempt $attempt/200"
            if .venv/bin/python -m pytest -s -vv --tb=long \
              tests/st/a5/host_build_graph/dfx/chip_swimlane/test_scheduler_phases.py \
              --case TestSchedulerPhases::resolve_dummy \
              --platform a5sim --device 0-15 -p no:xdist --pto-session-timeout 600 \
              --require-pto-isa --manual include --enable-chip-swimlane 2 \
              2>&1 | tee issue-2181-artifacts/pytest.log; then
              continue
            else
              status=$?
              echo "::error::issue 2181 reproduced on attempt $attempt"
              exit "$status"
            fi
          done

      - name: Upload issue 2181 reproduction artifacts
        if: failure() && inputs.issue_2181_repro
        uses: actions/upload-artifact@v4
        with:
          name: issue-2181-macos-a5sim-${{ github.run_attempt }}
          path: |
            issue-2181-artifacts/
            outputs/
          if-no-files-found: warn
          retention-days: 7

      - name: PMU smoke (a5)
        if: inputs.include_dfx_smokes && !inputs.issue_2181_repro
        run: |
          .venv/bin/python -m pytest tests/st/a5/tensormap_and_ringbuffer/dfx/pmu/test_pmu.py \
            --platform a5sim --device 0-15 -p no:xdist --pto-session-timeout 600 \
            --require-pto-isa --manual "${{ inputs.manual_mode == 'only' && 'only' || 'include' }}" --enable-pmu 2

      # `hybrid` here; see the mode-per-lane rationale in _st-sim-a2a3.yml.
      # a5sim takes this one because it is the payload-selective mode and a5's
      # payload path is the one that was broken (#1560): every task reaches the
      # manifest, but only Arg::dump()-marked args write bytes, so args.bin is
      # opened lazily and the manifest reports `bin_file: null` when nothing is
      # marked. This is also the mode simpler_setup.tools.core_swimlane replays
      # from, so it is the one whose producer must keep matching that consumer.
      - name: args_dump smoke (a5, hybrid)
        if: inputs.include_dfx_smokes && !inputs.issue_2181_repro
        run: |
          .venv/bin/python -m pytest tests/st/a5/tensormap_and_ringbuffer/dfx/args_dump/test_args_dump.py \
            --platform a5sim --device 0-15 -p no:xdist --pto-session-timeout 600 \
            --require-pto-isa --manual "${{ inputs.manual_mode == 'only' && 'only' || 'include' }}" \
            --dump-args hybrid

      - name: scope_stats smoke (a5)
        if: inputs.include_dfx_smokes && !inputs.issue_2181_repro
        run: |
          .venv/bin/python -m pytest tests/st/a5/tensormap_and_ringbuffer/dfx/scope_stats/ \
            --platform a5sim --device 0-15 -p no:xdist --pto-session-timeout 600 \
            --require-pto-isa --manual "${{ inputs.manual_mode == 'only' && 'only' || 'include' }}" \
            --enable-scope-stats
